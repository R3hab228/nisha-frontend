name: Lighthouse CI (Core Web Vitals & Speed)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - '.lighthouserc.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - '.lighthouserc.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  lighthouse:
    name: Mobile Core Web Vitals Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚡ Build Production Bundle (Vite)
        run: npm run build

      - name: 🔦 Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          uploadHandler: 'temporary-public-storage'

      - name: 📤 Upload Lighthouse HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-audit-reports
          path: .lighthouseci/
          retention-days: 14
