name: Lint & Frontend Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Validate JS & JSON Integrity
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚡ Verify Vite Build
        run: npm run build

      - name: 🧪 Run Automated Tests (Vitest)
        run: npm test

      - name: 🧹 ESLint Code Quality Check
        run: npm run lint

      - name: 🔍 Validate JavaScript Syntax (AST Check)
        run: |
          echo "Scanning and verifying all JavaScript files..."
          find . -maxdepth 3 -name "*.js" -not -path "*/node_modules/*" -not -path "*/dist/*" -not -path "*/public/*" -print -exec node --check {} \;
          echo "✅ All JavaScript files passed syntax verification!"

      - name: 🛡️ Validate JSON files (locales, manifest, vercel, lighthouserc)
        run: |
          node -e "
            const fs = require('fs');
            const files = ['package.json', 'locales.json', 'manifest.json', 'vercel.json', '.well-known/assetlinks.json', '.lighthouserc.json'];
            files.forEach(file => {
              if (fs.existsSync(file)) {
                JSON.parse(fs.readFileSync(file, 'utf8'));
                console.log('Valid JSON: ' + file);
              }
            });
          "
          echo "✅ All JSON files are structurally sound!"

      - name: 🚨 Notify Telegram on CI Failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID || secrets.ADMIN_ID }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: node .github/scripts/notify-failure.js
